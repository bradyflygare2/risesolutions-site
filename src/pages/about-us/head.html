<style>/* Pre-show the full sample-call transcript and the employment-application
   phone demo in a light gray, then darken each line or character as the
   existing animation reaches it. Heights stay the same. No page publish. */

/* ----- Call transcript (Home and /riseai-reception) ----- */
.rz .cc-cap {
  opacity: 1 !important;
}
.rz .cc-cap:not(.is-on) .cc-who,
.rz .cc-cap:not(.is-on) .cc-txt {
  opacity: .22;
}
.rz .cc-w {
  opacity: .22;
}
.rz .cc-w.is-on {
  opacity: 1;
}
.rz .cc-cap.is-on:not(:has(.cc-w)) .cc-who,
.rz .cc-cap.is-on:not(:has(.cc-w)) .cc-txt {
  opacity: 1;
}
.rz .cc-cap.is-on:has(.cc-w) .cc-who {
  opacity: 1;
}
.rz .cc-cap.is-on:has(.cc-w) .cc-txt {
  opacity: 1;
}

/* ----- Employment application phone (Home and /riseai-reception) ----- */
.rz .jt-anim .job-form {
  animation: none !important;
  opacity: 1 !important;
  transform: none !important;
}
.rz .jt-anim .jt-ph {
  opacity: 0 !important;
  animation: none !important;
}
.rz .jt-anim .jt-name .jt-txt span,
.rz .jt-anim .jt-phone .jt-txt span {
  max-width: 1em !important;
}
.rz .jt-anim .jt-name .jt-txt span {
  animation: rz-jt-ghost-n 10s steps(1, end) infinite backwards !important;
  animation-delay: calc(var(--i) * .11s) !important;
}
.rz .jt-anim .jt-phone .jt-txt span {
  animation: rz-jt-ghost-p 10s steps(1, end) infinite backwards !important;
  animation-delay: calc(var(--i) * .09s) !important;
}
@keyframes rz-jt-ghost-n {
  0%, 26.9% { opacity: .22; }
  27%, 100% { opacity: 1; }
}
@keyframes rz-jt-ghost-p {
  0%, 45.9% { opacity: .22; }
  46%, 100% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .rz .cc-cap,
  .rz .cc-cap .cc-who,
  .rz .cc-cap .cc-txt,
  .rz .cc-w,
  .rz .cc-foot {
    opacity: 1 !important;
  }
  .rz .jt-anim .job-form {
    opacity: 1 !important;
    animation: none !important;
    transform: none !important;
  }
  .rz .jt-anim .jt-txt span,
  .rz .jt-anim .jt-name .jt-txt span,
  .rz .jt-anim .jt-phone .jt-txt span {
    opacity: 1 !important;
    animation: none !important;
    max-width: 1em !important;
    transform: none !important;
    overflow: visible !important;
  }
  .rz .jt-anim .job-field,
  .rz .jt-anim .job-input {
    width: 100%;
  }
  .rz .jt-anim .jt-ph,
  .rz .jt-anim .jt-caret,
  .rz .jt-anim .jt-notif,
  .rz .jt-anim .jt-done {
    animation: none !important;
    display: none !important;
  }
}</style>

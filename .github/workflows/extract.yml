name: Extract site from capture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/extract.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/extract.js
      - run: node tools/blog-extract.js
      - run: node tools/images.js
      - run: node build.js
      - name: Commit src and media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src public
          git diff --cached --quiet || git commit -m "Extract pages, posts and media from capture"
          git push

name: Extract site from capture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/extract.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/extract.js
      - run: node build.js
      - name: Commit src
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet || git commit -m "Extract pages from capture"
          git push
